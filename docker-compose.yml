services:
  document-lab:
    build: .
    container_name: document-lab
    restart: unless-stopped
    ports:
      - "3012:3012"
    environment:
      REMOTE_ROOT: /remote
      DATA_ROOT: /app/data
      LOGS_ROOT: /app/logs
      WORKER_POLL_SECONDS: "1"
      COMMAND_TIMEOUT_SECONDS: "3600"
    volumes:
      - /home/homelabuser/RemoteDrop:/remote
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - ai-network

networks:
  ai-network:
    external: true
