services:
  document-lab:
    build:
      context: .
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    container_name: document-lab
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "3012:3012"
    environment:
      REMOTE_ROOT: /remote
      DATA_ROOT: /app/data
      LOGS_ROOT: /app/logs
      WORKER_POLL_SECONDS: "1"
      COMMAND_TIMEOUT_SECONDS: "3600"
    volumes:
      - /home/homelabuser/RemoteDrop:/remote
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - ai-network

networks:
  ai-network:
    external: true
